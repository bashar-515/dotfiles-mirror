[tools]
go = "latest"
golangci-lint = "v2.15.0"
node = "lts"
pnpm = "latest"

"go:golang.org/x/tools/gopls" = "latest"

"npm:@earendil-works/pi-coding-agent" = "latest"

"npm:portless" = "latest"

"npm:@astrojs/language-server" = "latest"
"npm:@prisma/language-server" = "latest"
"npm:svelte-language-server" = { version = "latest", trust_policy_excludes = ["svelte@4.2.20"] }
"npm:@tailwindcss/language-server" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:yaml-language-server" = "latest"

"github:docker/docker-language-server" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
